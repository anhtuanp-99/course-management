spring.application.name=course_management
server.port=8080

# Kích hoạt đồng thời dev và local
spring.profiles.active=dev,local

#jwt.secret=${JWT_SECRET:my-default-dev-secret-key-at-least-256-bits-long}
jwt.expiration=86400000
jwt.refresh-expiration=604800000
# Ép Spring MVC ném Exception khi route không tồn tại
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false